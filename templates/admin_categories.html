<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_categories.css') }}">
</head>

<body>

<section class="category-management">

    <div class="category-header">
        <div>
            <span class="section-line"></span>
            <h1>Category Management</h1>
            <p>Manage the categories available in your store.</p>
        </div>

        <button class="add-category-btn">
            + Add Category
        </button>
    </div>


    <div class="category-table-container">

        <table class="category-table">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Image</th>
                    <th>Category</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>

                {% for category in categories %}

                <tr>

                    <td>{{ category.id }}</td>

                    <td>
                        <img
                            src="{{ category.image }}"
                            alt="{{ category.name }}"
                            class="category-img"
                        >
                    </td>

                    <td class="category-name">
                        {{ category.name }}
                    </td>

                    <td class="description">
                        {{ category.description or 'No description' }}
                    </td>

                    <td class="actions">

                        <a href="/edit-category/{{ category.id }}"
                           class="edit-btn">
                            Edit
                        </a>

                        <a href="/delete-category/{{ category.id }}"
                           class="delete-btn"
                           onclick="return confirm('Are you sure you want to delete this category?')">
                            Delete
                        </a>

                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</section>

</body>
</html>
