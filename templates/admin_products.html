<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>

<div class="admin-container">

    <!-- Header -->

    <div class="admin-header">

    <div class="logo">
        <h1>📦 Product Management</h1>
    </div>

    <div class="nav-links">
        <a href="{{ url_for('admin_dashboard') }}">Dashboard</a>
        <a href="{{ url_for('home') }}">Store</a>
    </div>

</div>



    <!-- Edit Product -->

    {% if product %}

    <div class="dashboard-card">

        <h2>Edit Product</h2>

        <form action="{{ url_for('edit_product',product_id=product[0]) }}" method="POST" class="product-form">

            <input
            type="number"
            name="category_id"
            value="{{ product[1] }}"
            placeholder="Category ID"
            required>

            <input
            type="text"
            name="name"
            value="{{ product[2] }}"
            placeholder="Product Name"
            required>

            <input
            type="number"
            step="0.01"
            name="price"
            value="{{ product[3] }}"
            placeholder="Price"
            required>

            <input
            type="number"
            name="stock"
            value="{{ product[6] }}"
            placeholder="Stock"
            required>

            <input
            type="text"
            id="editImage"
            name="image"
            value="{{ product[5] }}"
            placeholder="Image URL"
            required>

            <textarea
            name="description"
            placeholder="Description">{{ product[4] }}</textarea>

            <div class="preview-box">

                <img
                id="editPreview"
                src="{{ product[5] }}">

            </div>

            <button type="submit" class="save-btn">
                Update Product
            </button>

        </form>

    </div>

    {% endif %}



    <!-- Add Product -->

    <div class="dashboard-card">

        <h2>Add New Product</h2>

        <form action="{{ url_for('add_products') }}" method="POST" class="product-form">

            <input
            type="number"
            name="category_id"
            placeholder="Category ID"
            required>

            <input
            type="text"
            name="name"
            placeholder="Product Name"
            required>

            <input
            type="number"
            step="0.01"
            name="price"
            placeholder="Price"
            required>

            <input
            type="number"
            name="stock"
            placeholder="Stock"
            required>

            <input
            type="text"
            id="image"
            name="image"
            placeholder="Image URL"
            required>

            <textarea
            name="description"
            placeholder="Description"></textarea>

            <div class="preview-box">

                <img
                id="preview"
                style="display:none;">

            </div>

            <button type="submit" class="add-btn">
                + Add Product
            </button>

        </form>

    </div>



    <!-- Product Table -->

    <div class="dashboard-card">

        <h2>All Products</h2>

        <div class="table-wrapper">

        <table class="product-table">

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Image</th>

                    <th>Name</th>

                    <th>Price</th>

                    <th>Category</th>

                    <th>Stock</th>

                    <th>Actions</th>

                </tr>

            </thead>

            <tbody>

            {% for product in products %}

            <tr>

                <td>{{ product[0] }}</td>

                <td>

                    <img
                    src="{{ product[5] }}"
                    class="table-image">

                </td>

                <td>{{ product[2] }}</td>

                <td>₹{{ product[3] }}</td>

                <td>{{ product[1] }}</td>

                <td>{{ product[6] }}</td>

                <td>

                    <a
                    href="{{ url_for('edit_product',product_id=product[0]) }}"
                    class="edit-btn">

                        Edit

                    </a>

                    <a
                    href="{{ url_for('delete_products',product_id=product[0]) }}"
                    class="delete-btn"
                    onclick="return confirm('Delete this product?')">

                        Delete

                    </a>

                </td>

            </tr>

            {% endfor %}

            </tbody>

        </table>

        </div>

    </div>

</div>

<script>

const image=document.getElementById("image");
const preview=document.getElementById("preview");

if(image){

image.addEventListener("input",function(){

preview.src=this.value;

preview.style.display="block";

});

}

const editImage=document.getElementById("editImage");
const editPreview=document.getElementById("editPreview");

if(editImage){

editImage.addEventListener("input",function(){

editPreview.src=this.value;

});

}

</script>

</body>
</html>
